const N_STAGES=STAGES.length;
let STATE={stages:{},view:'home',updatedAt:null};
const S={d:id=>(STATE.stages[id]&&STATE.stages[id].confirmed)?STATE.stages[id].data:null,all:()=>Object.fromEntries(STAGES.map(s=>[s.id,S.d(s.id)]))};
const stage=id=>STAGES.find(s=>s.id===+id);
const rec=id=>STATE.stages[id]||{};
/* 修正：須「所有」前面階段皆已確認才解鎖（原版只檢查前一階段，返回修改後下游仍可進入） */
const unlocked=id=>STAGES.every(s=>s.id>=+id||!!rec(s.id).confirmed);
const statusOf=id=>!unlocked(id)?'locked':rec(id).confirmed?'done':rec(id).draft?'draft':'open';
const isDone=id=>statusOf(id)==='done';
const doneCount=()=>STAGES.filter(s=>isDone(s.id)).length;
/* 前面階段在本階段確認之後又重新確認 → 本階段診斷依據舊資料（回傳那些階段 id） */
const staleBy=id=>{const r=rec(id);if(!r.confirmed)return[];return STAGES.filter(s=>s.id<+id&&rec(s.id).confirmedAt>r.confirmedAt).map(s=>s.id);};
/* dep 欄位：d[f.dep]===(f.depVal||'是') 才顯示；f.depReq 表示顯示時必填 */
const visibleOf=(f,d)=>!f.dep||d[f.dep]===(f.depVal||'是');
const requiredOf=f=>!!(f.req||(f.dep&&f.depReq));
let CURRENT_CARRY=[];let saveTimer=null;

function load(){try{const raw=localStorage.getItem(APP.storageKey);if(raw){const o=JSON.parse(raw);if(o&&o.stages)STATE=o;}}catch(e){console.warn('localStorage 讀取失敗',e);}}
function save(){STATE.updatedAt=new Date().toISOString();try{localStorage.setItem(APP.storageKey,JSON.stringify(STATE));}catch(e){console.warn('localStorage 寫入失敗',e);toast('無法儲存至瀏覽器（儲存空間或隱私模式限制）',true);}}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600);}
function modal(html){const m=document.getElementById('modal');document.getElementById('modalBody').innerHTML=html;m.classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function toggleSidebar(open){const sb=document.getElementById('sidebar'),ov=document.getElementById('sbOverlay');const o=open==null?!sb.classList.contains('open'):open;sb.classList.toggle('open',o);ov.classList.toggle('show',o);}
document.getElementById('menuBtn').onclick=()=>toggleSidebar();
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function renderBrand(){document.title=`${APP.platform}｜${APP.topic}`;document.getElementById('brandText').innerHTML=`${esc(APP.platform)}<span class="sub">${esc(APP.brandSub)}</span>`;}

/* ---------------- 路由 ---------------- */
function go(v,tab){if(location.hash.slice(1)===v){route(tab);}else{location.hash=v;if(tab)window._pendingTab=tab;}toggleSidebar(false);window.scrollTo({top:0});}
window.addEventListener('hashchange',()=>route(window._pendingTab));
function route(tab){const v=location.hash.slice(1)||STATE.view||'home';window._pendingTab=null;STATE.view=v;
  if(v==='home')renderHome();else if(v==='report')renderReport();else if(/^stage-\d+$/.test(v)&&stage(v.split('-')[1]))renderStage(+v.split('-')[1],tab);else renderHome();
  renderSidebar();renderProgress();}
function renderProgress(){const n=doneCount();document.getElementById('progText').textContent=`${n} / ${N_STAGES} 階段`;document.getElementById('progBar').style.width=(n/N_STAGES*100)+'%';}
function lockedMsg(id){const m=STAGES.find(s=>s.id<id&&!rec(s.id).confirmed);return`請先完成第 ${m?m.id:id-1} 階段並確認診斷`;}

/* ---------------- 側欄 ---------------- */
function renderSidebar(){const v=STATE.view;const sb=document.getElementById('sidebar');
  const stLabel={locked:'鎖定',open:'可開始',draft:'草稿中',done:'已確認'};
  sb.innerHTML=`<div class="sb-home ${v==='home'?'active':''}" onclick="go('home')">🎬 首頁｜開工說明</div><div class="sb-sep"></div><div class="sb-title">${esc(APP.flowName)}</div>
  ${STAGES.map(s=>{const st=statusOf(s.id);const lbl=st==='done'&&staleBy(s.id).length?'已確認（需更新）':stLabel[st];return`<div class="step ${st} ${v==='stage-'+s.id?'active':''} ${st==='done'?'done':st==='draft'||st==='open'?'current':''}" onclick="${st==='locked'?`toast('${lockedMsg(s.id)}',true)`:`go('stage-${s.id}')`}"><div class="num">${st==='done'?'✓':st==='locked'?'🔒':s.id}</div><div><div class="lbl">${s.title}</div><span class="en">${s.en}</span><span class="st">${lbl}</span></div></div>`}).join('')}
  <div class="sb-sep"></div><div class="sb-home ${v==='report'?'active':''}" onclick="go('report')">📄 企劃報告（${doneCount()}/${N_STAGES}）</div>
  <div class="sb-sep"></div><div class="tiny muted" style="padding:0 10px">進度自動儲存於此瀏覽器（localStorage）。<br>最後儲存：${STATE.updatedAt?new Date(STATE.updatedAt).toLocaleString('zh-TW'):'－'}</div>
  <div class="btn-row mt8" style="padding:0 6px"><button class="btn sm" onclick="exportJSON()">匯出進度</button><button class="btn sm" onclick="importJSON()">匯入進度</button><button class="btn sm danger ghost" onclick="confirmReset()">重置</button></div>`;}

/* ---------------- 首頁（場記板版面） ---------------- */
/* HERO_IMG 為空時的備援插圖：rough.js 手繪三格分鏡＋ 1:2:1 秒數條 */
function homeSketch(){const ink='#2b2622',P=[[14,'開場','#c8553d'],[128,'重點','#d9a23a'],[242,'行動','#4f7d5c']];
  let s=`<svg viewBox="0 0 360 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="手繪分鏡草圖：開場、重點、行動三格與 1 比 2 比 1 的秒數分配" font-family="LXGW WenKai TC,DFKai-SB,serif">`;
  P.forEach((p,i)=>{const x=p[0];
    s+=skRect(x,14,104,74,{stroke:ink,seed:3+i,roughness:1.3});
    s+=skLine(x+8,74,x+96,74,{stroke:ink,seed:9+i,roughness:1.6,strokeWidth:1});
    if(i===0)s+=`<text x="${x+52}" y="62" text-anchor="middle" font-size="36" fill="${p[2]}">?</text>`;
    if(i===1)s+=skDraw(g=>g.ellipse(x+52,50,62,30,{stroke:ink,strokeWidth:1.4,fill:p[2],fillStyle:'hachure',hachureGap:4,roughness:1.4,seed:5}),`<ellipse cx="${x+52}" cy="50" rx="31" ry="15" fill="${p[2]}" stroke="${ink}"/>`);
    if(i===2)s+=skRect(x+38,22,28,46,{stroke:ink,seed:6,roughness:1})+skLine(x+44,46,x+50,53,{stroke:p[2],strokeWidth:2.4,seed:7})+skLine(x+50,53,x+61,36,{stroke:p[2],strokeWidth:2.4,seed:8});
    s+=`<text x="${x+52}" y="110" text-anchor="middle" font-size="15" fill="${ink}">${i+1}. ${p[1]}</text>`;
    if(i<2)s+=skLine(x+108,51,x+122,51,{stroke:ink,seed:20+i,strokeWidth:1.6});});
  s+=`<text x="14" y="140" font-size="13" fill="#76695c">60 秒的時間分配（1：2：1）</text>`;
  [[14,83,'#c8553d','15 秒'],[97,166,'#d9a23a','30 秒'],[263,83,'#4f7d5c','15 秒']].forEach((b,i)=>{
    s+=skRect(b[0],150,b[1],26,{stroke:ink,fill:b[2],fillStyle:'hachure',hachureGap:4,hachureAngle:-41,roughness:1.2,seed:30+i});
    s+=`<text x="${b[0]+b[1]/2}" y="198" text-anchor="middle" font-size="14" fill="${ink}">${b[3]}</text>`;});
  return s+'</svg>';}

function renderHome(){const n=doneCount(),all=n===N_STAGES;const nx=STAGES.find(s=>!isDone(s.id));const next=(nx||STAGES[N_STAGES-1]).id;
  const art=HERO_IMG?`<img src="${HERO_IMG}" alt="導演筆記本插圖：分鏡草圖、場記板與鉛筆">`:homeSketch();
  const stTxt={done:'已確認',locked:'鎖定',draft:'草稿',open:'可開始'},stCls={done:'g',locked:'ex',draft:'y',open:'in'};
  const tileGo=s=>statusOf(s.id)==='locked'?`toast('${lockedMsg(s.id)}',true)`:`go('stage-${s.id}')`;
  document.getElementById('view').innerHTML=`
  <section class="slate"><div class="slate-clap" aria-hidden="true"></div><div class="slate-body"><div>
    <div class="eyebrow">${esc(APP.eyebrow)}</div><h1>${esc(APP.platform)}</h1><p class="lead">${CASE.heroLead}</p>
    <div class="slate-grid"><div><b>PROD.</b><span>期末專題</span></div><div><b>SCENE</b><span>${N_STAGES} 階段</span></div><div><b>TAKE</b><span>${n} / ${N_STAGES}</span></div><div><b>ROLL</b><span>約 3 小時</span></div></div>
    <div class="btn-row">${all?`<button class="btn primary lg" onclick="go('report')">九階段完成：查看企劃報告</button>`:`<button class="btn primary lg" onclick="go('stage-${next}')">${n?`繼續第 ${next} 階段`:'開始第 1 階段'}</button><button class="btn lg" onclick="go('report')">查看企劃報告</button>`}<button class="btn ghost" onclick="introOpen(0)">▶ 重播開場說明</button></div></div>
    <figure class="slate-art">${art}<figcaption>先想清楚，再開機</figcaption></figure></div></section>
  <div class="card"><div class="card-h"><h2>${esc(APP.flowName)}</h2><span class="pill">${n}/${N_STAGES} 已確認</span></div>
    <div class="reel"><div class="stage-tiles">${STAGES.map(s=>{const st=statusOf(s.id);return`<div class="tile ${st==='locked'?'locked':''} ${nx&&nx.id===s.id?'now':''}" onclick="${tileGo(s)}"><div class="n">SCENE ${String(s.id).padStart(2,'0')}</div><b>${s.title}</b><span>${s.en}</span><span class="st badge ${stCls[st]}">${stTxt[st]}</span></div>`}).join('')}</div></div>
    <p class="tiny muted mt8">黃框是下一格；鎖定的格子要等前面確認後才會打開。畫面窄時可左右滑動。</p></div>
  <div class="grid g2"><div class="card"><div class="card-h"><h2>參考範例人物</h2><span class="badge ex">虛構範例</span></div>
    <div class="profile"><div><div class="avatar-wrap">${AVATAR_SVG}<i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i></div></div>
    <div><h3 style="font-size:21px;margin-bottom:2px">${CASE.name}</h3><div class="small muted">${CASE.title}｜${CASE.system}</div><div class="small mt8">${CASE.intro}</div>
      <dl class="meta">${CASE.meta.map(m=>`<dt>${m[0]}</dt><dd>${m[1]}</dd>`).join('')}<dt>核心邏輯</dt><dd><b>${CASE.logic}</b></dd></dl></div></div></div>
    <div class="card"><div class="card-h"><h2>企劃常見 NG</h2><span class="badge r">NG TAKE</span></div><div class="grid" style="gap:10px">${CASE.pains.map((p,i)=>`<div class="pain"><div class="ic">NG${i+1}</div><div><b>${p[0]}</b><span>${p[1]}</span></div></div>`).join('')}</div><p class="tiny muted mt8">填寫時先對照這六個 NG，避免回家才發現做不完。</p></div></div>
  <div class="card"><div class="card-h"><h2>填完你會拿到</h2><span class="badge in">CALL SHEET</span></div>
    <div class="grid g3" style="gap:10px">${CASE.outcomes.map((o,i)=>`<div class="kpi ${'rygbyr'[i]||'b'}"><div class="v">${o[0]}</div><div class="l">${o[1]}</div></div>`).join('')}</div><p class="small muted mt12">${CASE.outcomeNote}</p>
    <hr class="sep"><h3>九階段做完的六件事</h3><div class="grid g3" style="gap:10px">${CASE.visionItems.map((v,i)=>`<div class="pain" style="border-style:solid"><div class="ic" style="border-color:var(--green);color:var(--green)">${i+1}</div><div><b>${v[0]}</b><span>${v[1]}</span></div></div>`).join('')}</div></div>
  <div class="card"><div class="card-h"><h2>使用說明</h2><span class="engine-tag"><i></i>${Engine.name}</span></div><div class="grid g2"><div><ol class="steps">
    <li>每個階段先看「方法說明」「操作指引」「參考範例」三張說明卡，再到「填寫資料」寫自己的版本。</li>
    <li>欄位下方的灰字是參考範例提示，只能對照；主題、數字與時間都要換成你自己的。</li>
    <li>按「確認診斷」後，系統依規則檢查秒數、字數、工具額度與每週時數，並解鎖下一階段。</li>
    <li>前面確認過的資料會出現在「前階段帶入」區塊，點一下就能帶進來，不用重打。</li>
    <li>九階段完成後，到「企劃報告」下載 PDF，再按「寄給老師」送出，Day15 用這份報告發表。</li>
    <li>資料只存在這台電腦的瀏覽器裡；換電腦或清除瀏覽紀錄前，先按側欄「匯出進度」備份。</li></ol></div>
    <div><h4>內容標示</h4><div class="legend"><div class="it"><span class="badge ex">範例</span>參考範例，供對照</div><div class="it"><span class="badge in">你的資料</span>你填寫並確認的內容</div><div class="it"><span class="badge dx">診斷推論</span>規則依你的輸入推導</div><div class="it"><span class="badge hy">待驗證假設</span>證據不足，實際試過才知道</div></div>
    <div class="note gray mt12"><b>關於診斷：</b>這裡沒有串接 AI 聊天機器人。所有結論都由固定規則產生，每條附規則編號，看得到是哪一條規則、根據哪一格資料。</div>
    <div class="note warn mt12"><b>寄出前確認：</b>第 1 階段的姓名會當作信件主旨，Email 讓老師知道是誰寄的、方便回信。</div></div></div></div>`;
  fxEnter('home');}

/* ---------------- 階段頁 ---------------- */
function renderStage(id,tab){const st=stage(id);if(!st)return renderHome();const r=rec(id);
  if(!unlocked(id)){const m=STAGES.find(s=>s.id<id&&!rec(s.id).confirmed);document.getElementById('view').innerHTML=`<div class="card lock-screen"><div class="ic">🔒</div><h2>第 ${id} 階段尚未解鎖</h2><p class="muted">請先完成第 ${m.id} 階段「${m.title}」並按「確認診斷」。</p><button class="btn primary" onclick="go('stage-${m.id}')">前往第 ${m.id} 階段</button></div>`;return;}
  tab=tab||(r.confirmed?'dx':r.draft?'input':'method');
  const st_=statusOf(id);const stale=staleBy(id);
  const extras=EXTRA_TABS.filter(x=>x.stage===id);
  const tabs=[['method','方法說明'],['guide','操作指引'],['demo','參考範例'],['input','填寫資料'],['dx','診斷結果'],...extras.map(x=>[x.key,x.label])];
  document.getElementById('view').innerHTML=`
  <div class="stage-hero"><div class="big">${id}</div><div style="flex:1"><div class="flex sb"><div><h1>${st.title}</h1><div class="en">STAGE ${id} ｜ ${st.en}</div></div><span class="badge ${st_==='done'?'g':'in'}">${st_==='done'?'已確認 '+new Date(r.confirmedAt).toLocaleString('zh-TW'):st_==='draft'?'草稿中':'可開始'}</span></div><div class="goal"><b>階段目標：</b>${st.goal}</div>
  ${stale.length?`<div class="note warn mt8"><b>前階段資料已更新：</b>第 ${stale.join('、')} 階段在本階段確認後重新確認過，本階段的帶入資料與診斷可能過期。建議按「返回修改」並重新確認診斷。</div>`:''}</div></div>
  <div class="tabs">${tabs.map(t=>`<div class="tab ${tab===t[0]?'active':''} ${(t[0]==='dx'&&r.dx)||(t[0]==='input'&&r.draft)?'has':''}" onclick="renderStage(${id},'${t[0]}')"><span class="dot"></span>${t[1]}</div>`).join('')}</div>
  <div class="tabpanel ${tab==='method'?'active':''}">${methodHTML(st)}</div>
  <div class="tabpanel ${tab==='guide'?'active':''}">${guideHTML(st)}</div>
  <div class="tabpanel ${tab==='demo'?'active':''}">${demoHTML(st)}</div>
  <div class="tabpanel ${tab==='input'?'active':''}" id="inputPanel">${inputHTML(st)}</div>
  <div class="tabpanel ${tab==='dx'?'active':''}">${r.dx?dxHTML(st,r.dx,r):`<div class="card lock-screen"><div class="ic">🧭</div><h3>尚未產生診斷</h3><p class="muted">請於「填寫資料」完成必填欄位並按「確認診斷」。</p><button class="btn primary" onclick="renderStage(${id},'input')">前往填寫資料</button></div>`}</div>
  ${extras.map(x=>`<div class="tabpanel ${tab===x.key?'active':''}">${x.html()}</div>`).join('')}`;
  if(tab==='input')bindForm(st);const ex=extras.find(x=>x.key===tab);if(ex&&ex.run)ex.run();
  window.scrollTo({top:0});
  fxEnter('stage-'+id+'-'+tab,_fxKey.indexOf('stage-'+id+'-')===0?'#view .tabpanel.active > *':null);setTimeout(fxAnnotate,420);}

function methodHTML(st){const m=st.method;return`<div class="card"><div class="card-h"><h2>方法說明</h2><span class="pill">${st.en}</span></div><p>${m.intro}</p><div class="grid g2 mt12">${m.points.map(p=>`<div class="kpi" style="border-left:4px solid var(--teal)"><b style="color:var(--navy)">${p[0]}</b><div class="small muted mt8" style="line-height:1.6">${p[1]}</div></div>`).join('')}</div><h4 class="mt16">使用工具</h4><div class="flex">${m.tools.map(t=>`<span class="pill" title="${t[1]}"><b>${t[0]}</b>｜${t[1]}</span>`).join('')}</div><div class="note mt12"><b>本階段交付物：</b>${m.deliverable}</div><div class="btn-row mt12"><button class="btn primary" onclick="renderStage(${st.id},'guide')">下一步：操作指引 →</button></div></div>`;}
function guideHTML(st){return`<div class="card"><div class="card-h"><h2>操作指引</h2></div><ol class="steps">${st.guide.map(g=>`<li>${g}</li>`).join('')}</ol><div class="legend mt16"><div class="it"><span class="badge ex">範例</span>參考範例資料</div><div class="it"><span class="badge in">你的資料</span>你填寫的資料</div><div class="it"><span class="badge dx">診斷推論</span>規則引擎輸出</div><div class="it"><span class="badge hy">待驗證假設</span>需驗證</div></div><div class="btn-row mt12"><button class="btn primary" onclick="renderStage(${st.id},'demo')">下一步：參考範例 →</button></div></div>`;}
function demoHTML(st){return`<div class="card"><div class="card-h"><h2>參考範例</h2><span class="badge ex">範例</span></div><div class="note gray">${st.demo}</div>${renderData(st,st.example,'ex')}<div class="footer-actions"><button class="btn primary" onclick="renderStage(${st.id},'input')">前往填寫資料 →</button></div></div>`;}

/* 唯讀資料渲染（參考範例／報告共用） */
const isEmptyVal=v=>v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
function renderData(st,d,badge){d=d||{};return st.sections.map(sec=>{const fs=sec.fields.filter(f=>visibleOf(f,d)&&!isEmptyVal(d[f.id]));if(!fs.length)return'';
  return`<div class="form-section"><h3><span class="badge ${badge}">${badge==='ex'?'範例':'你的資料'}</span>${sec.title}</h3>${fs.map(f=>{const v=d[f.id];let body='';
    if(f.type==='table')body=roTable(f,v);else if(f.type==='checks')body=`<div class="flex">${(v||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`;
    else if(f.type==='likert')body=barRows(f.items.map(it=>({label:it[1],value:num(v[it[0]]),text:num(v[it[0]])+'/5'})),5);
    else body=`<div style="white-space:pre-wrap">${esc(v)}</div>`;
    return`<div class="field"><label class="lbl">${esc(f.label)}</label>${body}</div>`;}).join('')}</div>`;}).join('');}
function roTable(f,rows){rows=(rows||[]).filter(r=>Object.values(r).some(x=>String(x??'').trim()));if(!rows.length)return'<span class="muted small">－</span>';
  return`<div class="tbl-wrap"><table class="tbl compact"><thead><tr>${f.cols.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${f.cols.map(c=>`<td style="${c.t==='calc'?'font-weight:700;text-align:center':''}">${c.t==='calc'?c.calc(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}

/* ---------------- 表單 ---------------- */
function inputHTML(st){const r=rec(st.id);const d=r.draft||{};CURRENT_CARRY=st.carry(S)||[];const nxt=stage(st.id+1);
  const carry=CURRENT_CARRY.length?`<div class="carry"><h4>🔗 前階段帶入（已確認資料）</h4>${CURRENT_CARRY.map((b,bi)=>`<div class="mb8"><b class="small">${esc(b.title)}</b>${b.note?`<div class="tiny muted">${esc(b.note)}</div>`:''}<div class="chips mt8">${(b.chips||[]).map((c,ci)=>`<span class="chip" onclick="applyChip(${st.id},${bi},${ci})" title="點選帶入">＋ ${esc(c.label)}</span>`).join('')}${(b.static||[]).map(s=>`<span class="chip static">${esc(s)}</span>`).join('')}</div>${(b.chips||[]).length>1&&!b.chips.every(c=>c.replace&&c.field===b.chips[0].field)?`<button class="btn sm mt8" onclick="applyAll(${st.id},${bi})">全部帶入</button>`:''}</div>`).join('')}</div>`:'';
  const banner=r.confirmed?`<div class="note ok"><b>本階段已確認。</b>表單為唯讀；如需修改請按「返回修改」，修改後需重新確認診斷，後續階段將暫時鎖定（資料保留）。 <button class="btn sm" onclick="reopen(${st.id})">返回修改</button></div>`:'';
  const form=st.sections.map((sec,i)=>`<div class="form-section"><h3><span class="n">${i+1}</span>${sec.title}${sec.desc?`<span class="tiny muted">${sec.desc}</span>`:''}</h3>${sec.fields.map(f=>fieldHTML(st,f,d)).join('')}</div>`).join('');
  return`<div class="card">${banner}${carry}<form id="stageForm" onsubmit="return false" ${r.confirmed?'class="ro"':''}>${form}</form><div id="formErrors"></div>
  <div class="footer-actions">${r.confirmed?`<button class="btn" onclick="renderStage(${st.id},'dx')">查看診斷結果</button>${nxt?`<button class="btn primary" onclick="go('stage-${nxt.id}')">前往第 ${nxt.id} 階段 →</button>`:`<button class="btn primary" onclick="go('report')">前往企劃報告 →</button>`}`:
  `<button class="btn" onclick="saveDraft(${st.id},true)">儲存草稿</button><button class="btn danger ghost" onclick="clearStage(${st.id})">清除本階段</button><span style="flex:1"></span><button class="btn primary lg" onclick="confirmStage(${st.id})">確認診斷 ✓</button>`}</div></div>`;}

/* 範例只以灰字提示呈現（本站不提供載入範例按鈕）；表格取前 2 列摘要 */
function exHint(f,v){if(isEmptyVal(v)||f.type==='likert')return'';let t;
  if(f.type==='checks')t=(v||[]).join('、');
  else if(f.type==='table'){const rows=(v||[]).filter(r=>Object.values(r).some(x=>String(x??'').trim()));if(!rows.length)return'';
    t=rows.slice(0,2).map(r=>f.cols.filter(c=>c.t!=='calc'&&String(r[c.k]??'').trim()).map(c=>`${c.l}：${cut(String(r[c.k]),18)}`).join('｜')).join('；')+(rows.length>2?`（範例共 ${rows.length} 列）`:'');}
  else t=String(v);
  return`<div class="ex"><b>範例：</b>${esc(t)}</div>`;}
function fieldHTML(st,f,d){const v=d[f.id];const req=requiredOf(f)?'<span class="req">*</span>':'';
  const exHtml=exHint(f,st.example[f.id]);
  const help=f.help?`<div class="help">${f.help}</div>`:'';let c='';
  switch(f.type){
    case'text':c=`<input type="text" data-f="${f.id}" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}">`;break;
    case'number':c=`<input type="number" step="any" data-f="${f.id}" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}">`;break;
    case'textarea':c=`<textarea data-f="${f.id}" placeholder="${esc(f.ph||'')}">${esc(v??'')}</textarea>`;break;
    case'select':c=`<select data-f="${f.id}"><option value="">請選擇</option>${f.options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;break;
    case'checks':c=`<div class="chk-group">${f.options.map(o=>`<label class="chk ${(v||[]).includes(o)?'on':''}"><input type="checkbox" data-f="${f.id}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;break;
    case'likert':c=f.items.map(it=>`<div class="flex mb8" style="gap:12px"><span style="width:110px;font-size:13px;font-weight:600">${it[1]}</span><div class="likert" style="flex:1">${[1,2,3,4,5].map(n=>`<label class="${v&&+v[it[0]]===n?'on':''}"><input type="radio" name="lk_${f.id}_${it[0]}" value="${n}" ${v&&+v[it[0]]===n?'checked':''}>${n}</label>`).join('')}</div></div>`).join('');break;
    case'table':c=tableHTML(f,v||[]);break;}
  const hidden=visibleOf(f,d)?'':'style="display:none"';
  return`<div class="field" id="fld_${f.id}" ${f.dep?`data-dep="${f.dep}" data-depval="${esc(f.depVal||'是')}"`:''} ${hidden}><label class="lbl">${esc(f.label)}${req}</label>${help}${c}${exHtml}<div class="err-msg" id="err_${f.id}"></div></div>`;}
function tableHTML(f,rows){if(!rows.length)rows=[{}];return`<div class="tbl-wrap"><table class="tbl tbl-edit" data-tbl="${f.id}"><thead><tr>${f.cols.map(c=>`<th style="width:${c.w||'auto'}">${c.l}</th>`).join('')}<th style="width:34px"></th></tr></thead><tbody>${rows.map((r,i)=>rowHTML(f,r,i)).join('')}</tbody></table></div><div class="btn-row mt8 no-print"><button class="btn sm" onclick="addRow('${f.id}')">＋ 新增一列</button><span class="tiny muted">至少 ${f.min||1} 列有效資料</span></div>`;}
function rowHTML(f,r,i){return`<tr data-row="${i}">${f.cols.map(c=>{const v=r[c.k]??'';
  if(c.t==='calc')return`<td class="calc" data-calc="${c.k}">${c.calc(r)}</td>`;
  if(c.t==='select')return`<td><select data-k="${c.k}"><option value="">－</option>${c.o.map(o=>`<option ${String(v)===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
  if(c.t==='number')return`<td><input type="number" step="any" data-k="${c.k}" value="${esc(v)}"></td>`;
  if(c.t==='textarea')return`<td><textarea data-k="${c.k}" rows="2">${esc(v)}</textarea></td>`;
  return`<td><input type="text" data-k="${c.k}" value="${esc(v)}"></td>`;}).join('')}<td><button type="button" class="rm" title="刪除此列" onclick="rmRow('${f.id}',${i})">✕</button></td></tr>`;}

function collect(st){const d={};st.sections.forEach(sec=>sec.fields.forEach(f=>{const el=document.getElementById('fld_'+f.id);if(!el)return;
  if(f.type==='table'){const rows=[];el.querySelectorAll('tbody tr').forEach(tr=>{const r={};tr.querySelectorAll('[data-k]').forEach(inp=>r[inp.dataset.k]=inp.value);rows.push(r);});d[f.id]=rows;}
  else if(f.type==='checks')d[f.id]=[...el.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);
  else if(f.type==='likert'){const o={};f.items.forEach(it=>{const c=el.querySelector(`input[name="lk_${f.id}_${it[0]}"]:checked`);if(c)o[it[0]]=+c.value;});d[f.id]=o;}
  else{const inp=el.querySelector('[data-f]');d[f.id]=inp?inp.value:'';}}));return d;}
function bindForm(st){const form=document.getElementById('stageForm');if(!form)return;const r=rec(st.id);
  if(r.confirmed){form.querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=true);return;}
  const h=e=>{const t=e.target;
    if(t.closest('.chk'))t.closest('.chk').classList.toggle('on',t.checked);
    if(t.type==='radio'&&t.closest('.likert'))t.closest('.likert').querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
    const tr=t.closest('tr');if(tr){const tbl=t.closest('table');const f=findField(st,tbl.dataset.tbl);const row={};tr.querySelectorAll('[data-k]').forEach(i=>row[i.dataset.k]=i.value);tr.querySelectorAll('[data-calc]').forEach(td=>{const c=f.cols.find(x=>x.k===td.dataset.calc);td.textContent=c.calc(row);});}
    if(t.dataset.f){document.querySelectorAll(`[data-dep="${t.dataset.f}"]`).forEach(el=>el.style.display=t.value===el.dataset.depval?'':'none');}
    const fld=t.closest('.field');if(fld)fld.classList.remove('invalid');
    clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveDraft(st.id,false),500);};
  form.addEventListener('input',h);form.addEventListener('change',h);}
function findField(st,id){for(const s of st.sections)for(const f of s.fields)if(f.id===id)return f;return null;}
function saveDraft(id,notify){const st=stage(id);const form=document.getElementById('stageForm');if(!form)return;const d=collect(st);STATE.stages[id]={...rec(id),draft:d};save();if(notify){toast('草稿已儲存');renderSidebar();}}
function refreshField(st,fid,d){const f=findField(st,fid);const el=document.getElementById('fld_'+fid);if(!el)return;const tmp=document.createElement('div');tmp.innerHTML=fieldHTML(st,f,d);el.replaceWith(tmp.firstElementChild);}
function addRow(fid){const st=stage(STATE.view.split('-')[1]);const d=collect(st);(d[fid]=d[fid]||[]).push({});refreshField(st,fid,d);saveDraft(st.id,false);}
function rmRow(fid,i){const st=stage(STATE.view.split('-')[1]);const d=collect(st);d[fid].splice(i,1);refreshField(st,fid,d);saveDraft(st.id,false);}
function loadExample(id){const st=stage(id);if(rec(id).confirmed){toast('本階段已確認，請先「返回修改」',true);return;}
  const d=JSON.parse(JSON.stringify(st.example));STATE.stages[id]={...rec(id),draft:d};save();renderStage(id,'input');toast('已載入範例資料（標示為範例，請依需求修改）');}
function clearStage(id){modal(`<h3>清除第 ${id} 階段資料？</h3><p class="muted">將刪除本階段草稿與診斷結果；後續階段資料保留但將鎖定。</p><div class="btn-row"><button class="btn danger" onclick="doClear(${id})">確認清除</button><button class="btn" onclick="closeModal()">取消</button></div>`);}
function doClear(id){delete STATE.stages[id];save();closeModal();renderStage(id,'input');renderSidebar();renderProgress();toast('已清除');}
function reopen(id){STATE.stages[id]={...rec(id),confirmed:false};save();renderSidebar();renderProgress();renderStage(id,'input');toast('已開放修改；完成後請重新確認診斷');}
/* 帶入規則：表格欄位 → 新增一列（深拷貝）；文字欄位 → 空白或 replace 時取代，否則換行附加 */
function mergeChip(st,d,c){const f=findField(st,c.field);
  if(f.type==='table'){const rows=(d[c.field]||[]).filter(r=>Object.values(r).some(x=>String(x??'').trim()));
    const same=r=>Object.keys(c.value).every(k=>String(r[k]??'').trim()===String(c.value[k]??'').trim()); // skip rows already carried in
    if(!rows.some(same))rows.push(JSON.parse(JSON.stringify(c.value)));d[c.field]=rows;}
  else{const cur=String(d[c.field]||'').trim();d[c.field]=c.replace||!cur?c.value:cur.includes(String(c.value).trim())?cur:cur+'\n'+c.value;}}
function applyChip(id,bi,ci){const st=stage(id);if(rec(id).confirmed)return toast('本階段已確認，請先「返回修改」',true);const c=CURRENT_CARRY[bi].chips[ci];const d=collect(st);
  mergeChip(st,d,c);refreshField(st,c.field,d);saveDraft(id,false);toast('已帶入');}
function applyAll(id,bi){const st=stage(id);if(rec(id).confirmed)return toast('本階段已確認，請先「返回修改」',true);const b=CURRENT_CARRY[bi];const d=collect(st);
  const seen=new Set(),use=b.chips.filter(c=>!c.replace||(!seen.has(c.field)&&seen.add(c.field))); // first replace chip per field wins
  use.forEach(c=>mergeChip(st,d,c));[...new Set(use.map(c=>c.field))].forEach(fid=>refreshField(st,fid,d));saveDraft(id,false);toast(`已帶入 ${use.length} 筆`);}

/* ---------------- 驗證 ---------------- */
function validate(st,d){const errs=[];st.sections.forEach(sec=>sec.fields.forEach(f=>{if(!visibleOf(f,d))return;const req=requiredOf(f);const v=d[f.id];let msg='';
  if(f.type==='table'){const rows=(v||[]).filter(r=>String(r[f.cols[0].k]??'').trim());if(req&&rows.length<(f.min||1))msg=`至少需填寫 ${f.min||1} 列有效資料（目前 ${rows.length} 列；第一欄為必填）`;
    else{const bad=[];rows.forEach((r,i)=>f.cols.forEach(c=>{if((c.t==='select'||c.t==='number')&&String(r[c.k]??'').trim()==='')bad.push(`第 ${i+1} 列「${c.l}」`);}));if(bad.length)msg='請完成：'+bad.slice(0,4).join('、')+(bad.length>4?` 等 ${bad.length} 處`:'');}}
  else if(f.type==='checks'){if(req&&(v||[]).length<(f.min||1))msg=`至少選擇 ${f.min||1} 項`;}
  else if(f.type==='likert'){const miss=f.items.filter(it=>!(v&&v[it[0]]));if(req&&miss.length)msg='請完成評分：'+miss.map(m=>m[1]).join('、');}
  else if(req&&String(v??'').trim()==='')msg='此欄位為必填';
  if(msg)errs.push({id:f.id,msg});}));
  if(st.validate)errs.push(...st.validate(d).map(m=>({id:null,msg:m})));return errs;}

async function confirmStage(id){const st=stage(id);const d=collect(st);const errs=validate(st,d);
  document.querySelectorAll('.field.invalid').forEach(e=>e.classList.remove('invalid'));
  document.querySelectorAll('.err-msg').forEach(e=>e.textContent='');
  errs.forEach(e=>{if(e.id){const el=document.getElementById('fld_'+e.id);el.classList.add('invalid');document.getElementById('err_'+e.id).textContent=e.msg;}});
  const box=document.getElementById('formErrors');
  if(errs.length){box.innerHTML=`<div class="note err"><b>尚有 ${errs.length} 處待修正：</b><ul class="clean small">${errs.map(e=>`<li>${e.id?esc(findField(st,e.id).label)+'：':''}${esc(e.msg)}</li>`).join('')}</ul></div>`;const first=errs.find(e=>e.id);if(first)document.getElementById('fld_'+first.id).scrollIntoView({behavior:'smooth',block:'center'});toast(`尚有 ${errs.length} 處待修正`,true);return;}
  box.innerHTML='';
  st.sections.forEach(sec=>sec.fields.forEach(f=>{if(f.type==='table')d[f.id]=(d[f.id]||[]).filter(r=>String(r[f.cols[0].k]??'').trim());if(f.type==='number'&&d[f.id]!=='')d[f.id]=+d[f.id];}));
  const dx=await Engine.diagnose(id,d,S);
  STATE.stages[id]={draft:d,data:d,dx,confirmed:true,confirmedAt:new Date().toISOString()};save();renderSidebar();renderProgress();renderStage(id,'dx');fxConfetti(id===N_STAGES||doneCount()===N_STAGES);
  const nxt=stage(id+1);toast(nxt?(unlocked(nxt.id)?`第 ${id} 階段診斷完成，第 ${nxt.id} 階段已解鎖`:`第 ${id} 階段診斷完成`):`${APP.flowName}全部完成！可前往企劃報告`);}

/* ---------------- 診斷結果 ---------------- */
function dxHTML(st,dx,r){const sc=dx.score;const col=sc>=75?'var(--green)':sc>=50?'var(--yellow)':'var(--red)';const nxt=stage(st.id+1);
  const item=x=>`<div class="dx-item"><span class="sev ${x.sev||'i'}"></span><div style="flex:1">${esc(x.text)}${x.verify?`<div class="tiny muted mt8">驗證方式：${esc(x.verify)}</div>`:''}</div><span class="rule" title="規則編號（可追溯）">${x.rule}</span></div>`;
  return`<div class="card"><div class="card-h"><h2>診斷結果</h2><div class="flex"><span class="badge dx">診斷推論</span><span class="engine-tag"><i></i>${esc(dx.engine||Engine.name)}｜${(dx.rulesFired||[]).length} 條規則觸發｜${dx.ms||0} ms</span></div></div>
  <div class="dx-head"><div class="score-ring"><div class="ring" style="background:conic-gradient(${col} ${sc*3.6}deg,var(--line) 0)"><b>${sc}</b></div><div><div class="small muted">${dx.scoreLabel}</div><div style="font-size:18px;font-weight:800;color:${col}">${dx.scoreKind==='state'?(sc>=75?'現況穩健':sc>=50?'現況有明顯缺口':'現況急需改善'):(sc>=75?'良好':sc>=50?'尚可，需補強':'不足，需重做')}</div><div class="tiny muted">${dx.scoreKind==='state'?'評估目前現況（分數越低，越需要優先改善）':'評估本階段資料的完整度與一致性'}；依規則扣分計算，非 LLM 評分</div></div></div>
  <div class="grid g4" style="gap:10px">${dx.metrics.map(m=>`<div class="kpi ${m.cls||''}"><div class="v" style="font-size:20px">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join('')}</div></div>
  <div class="grid g2 mt16"><div class="dx-block"><h3><span class="badge dx">診斷推論</span>問題評估</h3>${dx.assessment.map(item).join('')||'<span class="muted small">無</span>'}</div>
  <div class="dx-block" style="border-color:#f3d9a4;background:#fffcf5"><h3><span class="badge hy">待驗證假設</span>根因假設</h3>${dx.hypotheses.map(item).join('')||'<span class="muted small">本階段未產生需驗證之假設。</span>'}</div>
  <div class="dx-block"><h3><span class="badge dx">診斷推論</span>改善建議</h3>${dx.recommendations.map(item).join('')||'<span class="muted small">無額外建議，請依方法說明持續精進。</span>'}</div>
  <div class="dx-block"><h3><span class="badge dx">診斷推論</span>下一步行動</h3>${dx.nextActions.map(item).join('')}</div></div>
  <div class="dx-block"><h3><span class="badge dx">視覺化分析</span></h3>${dx.visual||''}</div>
  ${dx.aiExtra?`<div class="dx-block" style="border-color:#c7d7ff"><h3><span class="badge in">外部 AI 補充</span>${esc(dx.aiExtra.name)}</h3><div class="small" style="white-space:pre-wrap">${esc(dx.aiExtra.text||dx.aiExtra.error||'')}</div></div>`:''}
  <div class="flex tiny muted"><span><span class="sev h" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> 高嚴重度</span><span><span class="sev m" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> 中</span><span><span class="sev l" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> 正向／低</span><span><span class="sev i" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> 資訊</span><span>產生時間：${new Date(dx.generatedAt||Date.now()).toLocaleString('zh-TW')}</span></div>
  <div class="footer-actions"><button class="btn" onclick="renderStage(${st.id},'input')">檢視／修改輸入</button><button class="btn" onclick="reopen(${st.id})">返回修改</button><span style="flex:1"></span>${nxt?`<button class="btn primary lg" onclick="go('stage-${nxt.id}')">前往第 ${nxt.id} 階段：${nxt.title} →</button>`:`<button class="btn primary lg" onclick="go('report')">產生企劃報告 →</button>`}</div></div>`;}

/* ---------------- 企劃報告（由 REPORT 設定驅動） ---------------- */
const DX_KEY_LABEL={assessment:'問題評估',hypotheses:'根因假設（待驗證）',recommendations:'改善建議',nextActions:'下一步行動'};
function renderReport(){const n=doneCount();const all=n===N_STAGES;
  const dx=id=>isDone(id)?rec(id).dx:null;const d=id=>(isDone(id)&&rec(id).data)||{};
  const scores=STAGES.filter(s=>dx(s.id)).map(s=>dx(s.id).score);
  const ctx={n,all,d,dx,avgScore:scores.length?Math.round(avg(scores)):0};
  const sec=(t,body)=>`<div class="report-section"><h2>${t}</h2>${body}</div>`;
  const miss=STAGES.filter(s=>!isDone(s.id));
  const head=`<div class="no-print card tight flex sb"><div><b>${all?`${APP.flowName}已全部完成，報告已自動彙整。`:`已完成 ${n}/${N_STAGES} 階段，以下為部分彙整（完成後自動更新）。`}</b>${all?'':`<div class="tiny muted">尚未完成：${miss.map(s=>`第 ${s.id} 階段 ${s.title}`).join('、')}</div>`}</div><div class="btn-row"><button class="btn primary" onclick="savePDF()">⬇ 下載 PDF</button><button class="btn teal" onclick="sendPlan()">✉ 寄給老師</button>${all?'':`<button class="btn" onclick="go('stage-${miss[0].id}')">繼續第 ${miss[0].id} 階段</button>`}</div></div>`;
  const caseLines=REPORT.caseLines?REPORT.caseLines(ctx):[`案主：${CASE.name}｜${CASE.title}`]; // client-type: replaces CASE.system + case line
  const coverLines=(REPORT.coverLines?REPORT.coverLines(ctx):[]).concat(caseLines,[`報告日期：${new Date().toLocaleDateString('zh-TW')}　·　完成階段：${n}/${N_STAGES}　·　診斷引擎：${Engine.name}`]);
  const cover=`<div class="report-cover"><div class="tiny" style="opacity:.8;letter-spacing:2px">${esc(REPORT.eyebrow)}</div><h1>${esc(REPORT.title)}</h1><div class="sub">${esc(REPORT.subtitle(ctx))}</div>${REPORT.caseLines?'':`<div class="sub mt8">${CASE.system}</div>`}${coverLines.map(l=>`<div class="sub">${esc(l)}</div>`).join('')}</div>`;

/* ---------------- PDF（html2canvas 截圖 → jsPDF 分頁，A4 直式） ---------------- */
let _pdfBusy=false;
function pdfName(){const nm=String((S.d(1)||{}).name||'').replace(/[\\/:*?"<>|\s]/g,'');return`影片企劃_${nm||'未填姓名'}_${new Date().toLocaleDateString('sv-SE')}.pdf`;}
async function makePDF(){if(typeof html2canvas!=='function'||!window.jspdf)throw new Error('PDF 元件尚未載入（需要網路）');
  const docEl=document.getElementById('reportDoc');if(!docEl)throw new Error('找不到報告內容，請先開啟企劃報告頁');
  fxFinish();document.body.classList.add('pdf-mode');
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;window.scrollTo(0,0);
    let marks=null;
    const canvas=await html2canvas(docEl,{scale:1.5,logging:false,backgroundColor:'#fffdf7',useCORS:true,windowWidth:1280,
      ignoreElements:el=>!!(el.classList&&(el.classList.contains('no-print')||el.classList.contains('rough-annotation'))),
      onclone:cd=>{const c=cd.getElementById('reportDoc');
        /* html2canvas 會把畫面上 SVG 的計算尺寸寫死成 inline style；畫面寬度與 1280 不同時會撐破版面，移除後交回 CSS 計算 */
        c.querySelectorAll('svg').forEach(s=>['width','height','inline-size','block-size','transform-origin','perspective-origin'].forEach(k=>s.style.removeProperty(k)));
        const box=c.getBoundingClientRect();const rel=el=>el.getBoundingClientRect().top-box.top;
        marks={w:box.width,force:[...c.querySelectorAll('.page-break')].map(rel),
          cand:[...c.querySelectorAll('.report-section>*,.form-section,.field,tr,li,.dx-item,.kpi,.skbox')].map(rel)};}});
    const W=canvas.width,Ht=canvas.height,k=marks&&marks.w?W/marks.w:1.5,pageH=Math.floor(W*277/190);
    const force=(marks?marks.force:[]).map(v=>Math.round(v*k)).sort((a,b)=>a-b);
    const cand=(marks?marks.cand:[]).map(v=>Math.round(v*k)).sort((a,b)=>a-b);
    /* 斷頁：範圍內有強制分頁就用；否則取超過 4 成頁高後最後一個區塊起點；都沒有才硬切 */
    const cuts=[0];let y=0;
    while(y<Ht-4){const lim=y+pageH;const f=force.find(v=>v>y+20&&v<=lim&&v<Ht-20);let nx;
      if(f!=null)nx=f;else if(lim>=Ht)nx=Ht;else{const c=cand.filter(v=>v>y+pageH*.4&&v<=lim);nx=c.length?c[c.length-1]:lim;}
      cuts.push(nx);y=nx;}
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const n=cuts.length-1;
    for(let i=0;i<n;i++){const sy=cuts[i],sh=cuts[i+1]-sy;const pc=document.createElement('canvas');pc.width=W;pc.height=sh;
      const g=pc.getContext('2d');g.fillStyle='#fffdf7';g.fillRect(0,0,W,sh);g.drawImage(canvas,0,sy,W,sh,0,0,W,sh);
      if(i)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.85),'JPEG',10,10,190,sh*190/W);
      pdf.setFontSize(9);pdf.setTextColor(120);pdf.text(`${i+1} / ${n}`,200,292,{align:'right'});}
    return pdf;
  }finally{document.body.classList.remove('pdf-mode');}}
async function savePDF(){if(_pdfBusy)return toast('PDF 產生中，請稍候');_pdfBusy=true;toast('正在產生 PDF，約需 5～15 秒…');
  try{const pdf=await makePDF();pdf.save(pdfName());toast('PDF 已下載：'+pdfName());}
  catch(e){console.error('PDF 產生失敗',e);toast('PDF 產生失敗：'+e.message,true);}
  finally{_pdfBusy=false;}}

function introGo(i){if(i<0||i>=INTRO.length)return;_introI=i;const x=INTRO[i],b=id=>document.getElementById(id),last=i===INTRO.length-1;

const INTRO_GLYPHS='先想清楚再開機期末專題前一格確認下一格才解鎖主題零件腳本分鏡聲音額度剪輯發布時程方法說明為什麼要做操作指引怎麼填參考範例別人先看三張卡再動手我家阿嬤的炒米粉影片林佳穎巷口麵包店開店只能寫你自己回家做得出來秒數旁白約字三幕比例每週可用小時需要每天有點你排規則扣分看到原因企劃與預計流程報告旨姓名，：（）';
/* 手繪風場景：設計座標 800×380，等比縮放置中；線條每 4 格重抖一次（line boil） */
function introSketch(p){const INK='#2b2622',RED='#c8553d',YEL='#d9a23a',GRN='#4f7d5c',BLU='#2f5d73',GRAY='#a3968a',CARD='#fffcf5';
  const host=()=>document.getElementById('introStage');let W=10,H=10;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a),0,1),ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  const boil=()=>Math.floor(p.frameCount/4);
  /* wobbly line drawn up to fraction k */
  const wl=(x1,y1,x2,y2,sd,k)=>{k=k==null?1:k;if(k<=0)return;p.noFill();const n=Math.max(2,Math.ceil(p.dist(x1,y1,x2,y2)/14));p.beginShape();
    for(let i=0;i<=n;i++){const u=i/n*k;const jx=(p.noise(sd+i*.37,boil()*1.7)-.5)*3,jy=(p.noise(sd+40+i*.37,boil()*1.7)-.5)*3;p.vertex(p.lerp(x1,x2,u)+jx,p.lerp(y1,y2,u)+jy);}p.endShape();};
  const wr=(x,y,w,h,sd,k,fc)=>{k=k==null?1:k;if(fc&&k>.9){p.push();p.noStroke();p.fill(fc);p.rect(x,y,w,h);p.pop();}const e=[[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];e.forEach((s,i)=>wl(s[0],s[1],s[2],s[3],sd+i*9,clamp(k*4-i,0,1)));};
  const wc=(cx,cy,rx,ry,sd,k)=>{k=k==null?1:k;if(k<=0)return;p.noFill();const n=40;p.beginShape();for(let i=0;i<=n*k;i++){const a=i/n*p.TWO_PI-p.HALF_PI;const j=(p.noise(sd+i*.3,boil()*1.7)-.5)*4;p.vertex(cx+(rx+j)*Math.cos(a),cy+(ry+j)*Math.sin(a));}p.endShape();};
  const hatch=(x,y,w,h,col,sd)=>{p.push();p.stroke(col);p.strokeWeight(1.4);for(let d=6;d<w+h;d+=7){const x1=x+Math.max(0,d-h),y1=y+Math.min(h,d),x2=x+Math.min(w,d),y2=y+Math.max(0,d-w);wl(x1,y1,x2,y2,sd+d,1);}p.pop();};
  const check=(x,y,s,col,k,sd)=>{p.push();p.stroke(col);p.strokeWeight(3.2);wl(x,y,x+s*.35,y+s*.4,sd,seg(k,0,.4));wl(x+s*.35,y+s*.4,x+s,y-s*.45,sd+5,seg(k,.4,1));p.pop();};
  const txt=(s,x,y,sz,col,al,font)=>{p.push();p.noStroke();p.fill(col);p.textFont(font||'LXGW WenKai TC');p.textSize(sz);p.textAlign(al||p.LEFT,p.BASELINE);p.text(s,x,y);p.pop();};
  p.setup=()=>{W=host().clientWidth||10;H=host().clientHeight||10;p.createCanvas(W,H);p.frameRate(30);
    if(document.fonts&&document.fonts.load)document.fonts.load('24px "LXGW WenKai TC"',INTRO_GLYPHS).catch(e=>console.warn('開場字型載入失敗，改用備用字型',e));};
  p.windowResized=()=>{W=host().clientWidth||10;H=host().clientHeight||10;p.resizeCanvas(W,H);};
  const scenes={
    title:t=>{const ph=t%3.2,open=ph<.5?ease(seg(ph,0,.5)):ph<1.9?1:ph<2.05?1-seg(ph,1.9,2.05):0,ang=-.42*open;
      wr(250,140,300,170,11,ease(seg(t,0,.9)),CARD);
      txt('PROD.',272,186,15,RED,p.LEFT,'Special Elite');txt('期末專題',350,188,24,INK);
