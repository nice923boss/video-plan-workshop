<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影片企劃導演工作台｜期末專題影片企劃與預計流程</title>
<meta name="description" content="九階段引導填寫：把期末專題從一個想法排成做得完的影片企劃，逐步檢查秒數、字數、工具額度與時程，最後下載《影片企劃與預計流程報告》PDF。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<!-- rough.js 同步載入：診斷視覺化在第一次渲染就要用；其餘函式庫 defer，未載入時各功能自動降級 -->
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/rough-notation@0.5.1/lib/rough-notation.iife.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ======================================================
   設計系統：導演筆記本（紙張、墨線、底片條、場記板）
   ====================================================== */
:root{
  --paper:#f3ead8; --paper-2:#fbf7ee; --paper-3:#ece0c8; --card:#fffcf5;
  --ink:#2b2622; --ink-2:#4a4038; --muted:#76695c; --muted-2:#a09280;
  --line:#d8cab0; --line-2:#bfae8f;
  --red:#c8553d; --red-soft:#f7e3dc; --yellow:#d9a23a; --yellow-soft:#f9edd3;
  --green:#4f7d5c; --green-soft:#e3ede2; --blue:#2f5d73; --blue-soft:#e0eaee;
  --navy:var(--ink); --teal:var(--blue); --primary:var(--red);
  --hand:"LXGW WenKai TC","DFKai-SB","BiauKai","Kaiti TC",serif;
  --type:"Special Elite","Courier New",monospace;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --sh:3px 3px 0 var(--ink); --sh-s:2px 2px 0 var(--ink);
  --r-hand:255px 15px 225px 15px/15px 225px 15px 255px;
  --r-card:16px 5px 14px 6px/6px 14px 5px 16px;
  --topbar-h:62px; --sidebar-w:278px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;
  background:var(--paper) radial-gradient(rgba(43,38,34,.07) 1px,transparent 1.3px) 0 0/20px 20px}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.3;color:var(--ink);font-family:var(--hand);font-weight:700}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px} h4{font-size:15px;color:var(--ink-2)}
p{margin:0 0 .8em}
small{font-size:12.5px}
code,.mono{font-family:var(--type);font-size:.9em;background:var(--paper-3);padding:1px 5px;border-radius:3px}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::placeholder{color:var(--muted-2)}
::selection{background:var(--yellow-soft)}

/* ---------- 頂部列：墨色底＋場記板斜紋 ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);background:var(--ink);color:var(--paper-2);display:flex;align-items:center;gap:14px;padding:0 18px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;background:repeating-linear-gradient(-45deg,var(--ink) 0 9px,var(--paper-2) 9px 18px);border-bottom:1.5px solid var(--ink)}
.topbar .brand{display:flex;align-items:center;gap:11px;font-family:var(--hand);font-weight:700;font-size:18px;letter-spacing:.5px;white-space:nowrap}
.topbar .brand .logo{width:38px;height:38px;border-radius:7px 3px 8px 4px;background:var(--paper-2);color:var(--ink);display:grid;place-items:center;font-size:21px;font-weight:700;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--red)}
.topbar .brand .sub{font-family:var(--font);font-weight:400;font-size:11.5px;opacity:.7;display:block;line-height:1.2;letter-spacing:0}
.topbar .spacer{flex:1}
.topbar .progress{display:flex;align-items:center;gap:10px;font-family:var(--type);font-size:12.5px;min-width:190px}
.topbar .progress .bar{flex:1;height:10px;border:1.5px solid var(--paper-2);border-radius:2px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(251,247,238,.25) 9px 10px)}
.topbar .progress .bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .5s}
.topbar .btn{background:transparent;color:var(--paper-2);border:1.5px solid rgba(251,247,238,.55);box-shadow:none}
.topbar .btn:hover{background:rgba(251,247,238,.12);color:#fff;transform:none;box-shadow:none}
.topbar .menu-btn{display:none}

/* ---------- 版面：側欄是一捲底片 ---------- */
.app{display:flex;min-height:calc(100vh - var(--topbar-h))}
.sidebar{width:var(--sidebar-w);flex:0 0 auto;padding:22px 26px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow:auto;color:var(--paper-2);
  background-color:#221d19;
  background-image:linear-gradient(180deg,rgba(243,234,216,.8) 0 9px,transparent 9px 20px),linear-gradient(180deg,rgba(243,234,216,.8) 0 9px,transparent 9px 20px);
  background-size:8px 20px,8px 20px;background-repeat:repeat-y;background-position:left 8px top 14px,right 8px top 14px;background-attachment:local}
.sidebar .sb-title{font-family:var(--type);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#bfae8f;margin:6px 4px 10px}
.sidebar .muted{color:#bfae8f}
.main{flex:1;min-width:0;padding:32px 34px 40px}
.container{max-width:1180px;margin:0 auto}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;border-radius:3px;cursor:pointer;border:1.5px solid #4a4038;background:#2d2722;transition:.15s;position:relative}
.step:hover{background:#3a322b}
.step.active{background:var(--paper-2);border-color:var(--paper-2)}
.step.active .lbl{color:var(--ink)} .step.active .en{color:var(--muted)}
.step.locked{opacity:.45;cursor:not-allowed}
.step .num{width:28px;height:28px;border-radius:3px;display:grid;place-items:center;font-family:var(--type);font-size:13px;flex:0 0 auto;background:#4a4038;color:var(--paper-2)}
.step.done .num{background:var(--green);color:#fff}
.step.current .num{background:var(--yellow);color:var(--ink)}
.step .lbl{font-family:var(--hand);font-size:15px;font-weight:700;color:var(--paper-2);line-height:1.3}
.step .en{font-family:var(--type);font-size:10.5px;color:#a09280;display:block;margin-top:2px}
.step .st{font-size:10.5px;margin-top:4px;display:inline-block;padding:0 7px;border-radius:2px;background:#4a4038;color:#e6dac4}
.step.done .st{background:var(--green);color:#fff}
.step.current .st{background:var(--yellow);color:var(--ink)}
.step.active .st{outline:1px solid var(--ink-2)}
.sb-home{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:3px;cursor:pointer;font-family:var(--hand);font-weight:700;font-size:15px;color:var(--paper-2);border:1.5px dashed #6a5d50}
.sb-home:hover{background:#3a322b}
.sb-home.active{background:var(--paper-2);color:var(--ink);border-style:solid}
.sb-sep{height:0;border-top:1.5px dashed #4a4038;margin:12px 2px}
.sidebar .btn{background:#2d2722;color:var(--paper-2);border-color:#6a5d50;box-shadow:none}
.sidebar .btn:hover{background:#3a322b;transform:none;box-shadow:none}
.sidebar .btn.danger{color:#f0a493}

/* ---------- 卡片與元件 ---------- */
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-card);box-shadow:4px 4px 0 var(--ink);padding:22px 24px;margin-bottom:22px}
.card.tight{padding:14px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 17px;border-radius:var(--r-hand);border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;line-height:1.2;white-space:nowrap;box-shadow:var(--sh-s)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.teal{background:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.btn.ghost{background:transparent;border-style:dashed;box-shadow:none}
.btn.ghost:hover{box-shadow:none;background:rgba(43,38,34,.05)}
.btn.sm{padding:5px 11px;font-size:12.5px;box-shadow:1.5px 1.5px 0 var(--ink)}
.btn.lg{padding:12px 24px;font-size:16px;font-family:var(--hand)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:3px;font-size:11.5px;font-weight:700;letter-spacing:.3px;line-height:1.7;white-space:nowrap;border:1.5px solid currentColor}
.badge.ex{background:var(--paper-3);color:var(--muted)}
.badge.in{background:var(--blue-soft);color:var(--blue)}
.badge.dx{background:var(--green-soft);color:var(--green)}
.badge.hy{background:var(--yellow-soft);color:#93680f}
.badge.g{background:var(--green-soft);color:var(--green)} .badge.y{background:var(--yellow-soft);color:#93680f} .badge.r{background:var(--red-soft);color:var(--red)}
.badge.navy{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.pill{display:inline-block;padding:2px 11px;border-radius:var(--r-hand);background:var(--paper-2);border:1.5px solid var(--ink-2);font-size:12.5px;color:var(--ink-2)}
.kpi{background:var(--paper-2);border:2px dashed var(--ink-2);border-radius:6px;padding:13px 15px;position:relative}
.kpi .v{font-family:var(--hand);font-size:28px;font-weight:700;color:var(--ink);line-height:1.15}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.g{border-left:7px solid var(--green)} .kpi.y{border-left:7px solid var(--yellow)} .kpi.r{border-left:7px solid var(--red)} .kpi.b{border-left:7px solid var(--blue)}
.light{display:inline-block;width:15px;height:15px;border-radius:50%;vertical-align:middle;border:2px solid var(--ink)}
.light.g{background:var(--green)} .light.y{background:var(--yellow)} .light.r{background:var(--red)} .light.n{background:var(--paper-3)}
.note{background:var(--blue-soft);border:1.5px solid var(--ink-2);border-left:6px solid var(--blue);padding:10px 14px;border-radius:2px 8px 8px 2px;font-size:13.5px;margin:10px 0;box-shadow:2px 3px 0 rgba(43,38,34,.12)}
.note.warn{border-left-color:var(--yellow);background:var(--yellow-soft)}
.note.ok{border-left-color:var(--green);background:var(--green-soft)}
.note.err{border-left-color:var(--red);background:var(--red-soft)}
.note.gray{border-left-color:var(--muted-2);background:var(--paper-2)}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.right{text-align:right} .center{text-align:center}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
hr.sep{border:0;border-top:1.5px dashed var(--line-2);margin:16px 0}
ul.clean{padding-left:18px;margin:4px 0}
ul.clean li{margin:3px 0}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{position:relative;padding:9px 0 9px 44px;border-bottom:1.5px dashed var(--line);counter-increment:s}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:9px;width:32px;height:26px;border:2px solid var(--ink);border-radius:3px;background:var(--yellow-soft);color:var(--ink);font-family:var(--type);font-size:12px;display:grid;place-items:center}
ol.steps li:last-child{border-bottom:0}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border:1px solid var(--line-2);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--paper-3);font-family:var(--hand);font-weight:700;color:var(--ink);font-size:13.5px;white-space:nowrap}
.tbl tr:nth-child(even) td{background:rgba(236,224,200,.3)}
.tbl.compact th,.tbl.compact td{padding:5px 8px;font-size:12.5px}
.tbl-wrap{overflow:auto;border-radius:4px;border:2px solid var(--ink)}
.tbl-wrap .tbl{border:0}
.tbl-wrap .tbl th:first-child,.tbl-wrap .tbl td:first-child{border-left:0}
.tbl-wrap .tbl th:last-child,.tbl-wrap .tbl td:last-child{border-right:0}
.tbl-wrap .tbl tr:first-child th{border-top:0}
.tbl-wrap .tbl tr:last-child td{border-bottom:0}

/* 表單：橫線紙上填寫 */
.field{margin-bottom:18px}
.field label.lbl{display:flex;align-items:center;gap:6px;font-family:var(--hand);font-weight:700;font-size:15.5px;color:var(--ink);margin-bottom:5px;flex-wrap:wrap}
.field .req{color:var(--red);font-weight:800}
.field .help{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field .ex{font-size:12px;color:var(--muted-2);padding:4px 2px 0;line-height:1.55}
.field .ex b{color:var(--muted);font-weight:700;font-family:var(--type);font-size:11px;letter-spacing:.5px;margin-right:2px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:9px 11px;border:2px solid var(--ink-2);border-radius:7px 3px 6px 4px;background:#fffefa;outline:none;transition:.15s}
.field textarea{min-height:92px;resize:vertical;line-height:28px;padding-top:6px;background:#fffefa linear-gradient(transparent 27px,var(--line) 27px) 0 6px/100% 28px local}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:3px 3px 0 var(--yellow)}
.field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .tbl-wrap{border-color:var(--red);box-shadow:3px 3px 0 var(--red-soft)}
.field .err-msg{display:none;color:var(--red);font-size:12.5px;margin-top:4px;font-weight:700}
.field.invalid .err-msg{display:block}
.chk-group{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1.5px solid var(--ink-2);border-radius:var(--r-hand);background:#fffefa;cursor:pointer;font-size:13px;user-select:none}
.chk input{margin:0;accent-color:var(--red)}
.chk.on{background:var(--yellow-soft);border:2px solid var(--ink);font-weight:700;box-shadow:var(--sh-s)}
.likert{display:flex;gap:4px;flex-wrap:wrap}
.likert label{flex:1;min-width:46px;text-align:center;border:1.5px solid var(--ink-2);border-radius:4px;padding:6px 4px;cursor:pointer;font-size:12.5px;background:#fffefa}
.likert label.on{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.likert input{display:none}
.tbl-edit input,.tbl-edit select,.tbl-edit textarea{width:100%;min-width:90px;padding:6px 8px;border:1.5px solid var(--line-2);border-radius:4px;background:#fffefa;font-size:13px}
.tbl-edit textarea{min-height:40px;resize:vertical}
.tbl-edit td{padding:5px 6px;vertical-align:middle}
.tbl-edit td.calc{font-weight:700;text-align:center;background:var(--paper-3);white-space:nowrap;font-family:var(--type)}
.tbl-edit .rm{border:0;background:transparent;color:var(--muted-2);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.tbl-edit .rm:hover{color:var(--red);background:var(--red-soft)}
.form-section{border:1.5px solid var(--ink-2);border-radius:6px 3px 7px 4px;padding:16px 18px;margin-bottom:18px;background:var(--paper-2)}
.form-section>h3{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px dashed var(--line-2);flex-wrap:wrap}
.form-section>h3 .n{width:28px;height:28px;border-radius:3px;background:var(--ink);color:var(--paper-2);font-family:var(--type);font-size:13px;display:grid;place-items:center}

/* 分頁：筆記本索引標籤 */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:22px;overflow-x:auto;padding:4px 4px 0}
.tab{padding:8px 15px;font-family:var(--hand);font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;border:2px solid var(--ink-2);border-bottom:0;border-radius:9px 9px 0 0;background:var(--paper-3);white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative;top:2px}
.tab:hover{color:var(--ink);background:var(--paper-2)}
.tab.active{color:var(--red);background:var(--card);border-color:var(--ink);border-bottom:2px solid var(--card);z-index:1}
.tab .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted-2)}
.tab.has .dot{background:var(--green);border-color:var(--green)}
.tabpanel{display:none}.tabpanel.active{display:block}

/* 階段標頭：場記板 */
.stage-hero{display:flex;gap:22px;align-items:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-card);padding:24px 24px 20px;margin-bottom:20px;box-shadow:4px 4px 0 var(--ink);position:relative}
.stage-hero .big{width:66px;height:58px;margin-top:14px;border-radius:2px 2px 6px 6px;background:var(--ink);color:var(--paper-2);font-family:var(--type);font-size:28px;display:grid;place-items:center;flex:0 0 auto;position:relative}
.stage-hero .big::before{content:"";position:absolute;left:-2px;right:-2px;top:-15px;height:12px;border:2px solid var(--ink);border-radius:2px;background:repeating-linear-gradient(-45deg,var(--ink) 0 6px,var(--paper-2) 6px 12px);transform:rotate(-8deg);transform-origin:left bottom}
.stage-hero h1{font-size:27px;margin-bottom:0}
.stage-hero .en{font-family:var(--type);color:var(--muted);font-size:12.5px;margin-bottom:8px;letter-spacing:.5px}
.stage-hero .goal{font-size:14px;color:var(--ink-2)}

/* 首頁：場記板主視覺 */
.slate{border:2px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);margin-bottom:24px;overflow:hidden;background:var(--ink);color:var(--paper-2)}
.slate-clap{height:34px;background:repeating-linear-gradient(-55deg,var(--ink) 0 24px,var(--paper-2) 24px 48px);border-bottom:3px solid var(--paper-2);transform-origin:0 100%;animation:clap 1.3s ease-out .2s both}
@keyframes clap{0%{transform:rotate(-9deg)}55%{transform:rotate(-9deg)}70%{transform:rotate(0)}82%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}
.slate-body{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;padding:26px 28px 28px;align-items:center}
.slate .eyebrow{font-family:var(--type);font-size:12.5px;letter-spacing:2.5px;color:var(--yellow)}
.slate h1{color:var(--paper-2);font-size:36px;margin:6px 0 10px}
.slate .lead{color:#dccfb8;font-size:15px;max-width:640px}
.slate-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid rgba(251,247,238,.5);margin:14px 0 18px}
.slate-grid div{padding:7px 10px;border-right:1.5px solid rgba(251,247,238,.5)}
.slate-grid div:last-child{border-right:0}
.slate-grid b{display:block;font-family:var(--type);font-weight:400;font-size:10.5px;letter-spacing:1.5px;color:#bfae8f}
.slate-grid span{font-family:var(--hand);font-size:19px;font-weight:700}
.slate .btn{box-shadow:2px 2px 0 var(--paper-2);border-color:var(--paper-2)}
.slate .btn:hover{box-shadow:3px 3px 0 var(--paper-2)}
.slate .btn.ghost{color:var(--paper-2)}
.slate-art{margin:0;background:var(--paper-2);border-radius:4px;padding:10px;transform:rotate(1.5deg);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.slate-art img,.slate-art svg{display:block;width:100%;height:auto;border-radius:2px}
.slate-art figcaption{font-family:var(--hand);color:var(--ink-2);font-size:13px;text-align:center;margin-top:6px}
.hero{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-card);padding:28px 30px;margin-bottom:22px;box-shadow:4px 4px 0 var(--ink)}
.hero .eyebrow{font-family:var(--type);font-size:12px;letter-spacing:2px;color:var(--red)}
.hero h1{font-size:32px;margin:6px 0 8px}
.hero .lead{font-size:15.5px;color:var(--muted);max-width:760px}
.reel{background-color:var(--ink);border-radius:4px;padding:20px 10px;overflow-x:auto;
  background-image:linear-gradient(90deg,var(--paper-3) 0 10px,transparent 10px 22px),linear-gradient(90deg,var(--paper-3) 0 10px,transparent 10px 22px);
  background-size:22px 7px,22px 7px;background-repeat:repeat-x;background-position:6px 6px,6px calc(100% - 6px)}
.reel .stage-tiles{display:grid;grid-template-columns:repeat(9,minmax(104px,1fr));gap:6px}
.stage-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:2px solid transparent;border-radius:3px;padding:10px 9px 9px;background:var(--paper-2);cursor:pointer;transition:transform .15s;position:relative;display:flex;flex-direction:column;gap:3px;min-height:128px}
.tile:hover{transform:translateY(-3px)}
.tile.now{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(217,162,58,.35)}
.tile.locked{opacity:.55}
.tile .n{font-family:var(--type);font-size:11px;color:var(--muted);letter-spacing:1px}
.tile b{display:block;font-family:var(--hand);font-size:16px;color:var(--ink);line-height:1.25}
.tile span{font-size:11px;color:var(--muted)}
.tile .st{margin-top:auto;align-self:flex-start}
.profile{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}
.avatar-wrap{position:relative;border-radius:4px;overflow:hidden;background:var(--blue);aspect-ratio:368/430;border:2px solid var(--ink);box-shadow:var(--sh);transform:rotate(-2deg)}
.avatar-wrap svg{width:100%;height:100%;display:block}
.avatar-wrap .corner{position:absolute;width:20px;height:20px;border:3px solid var(--yellow)}
.avatar-wrap .c1{top:7px;left:7px;border-right:0;border-bottom:0}.avatar-wrap .c2{top:7px;right:7px;border-left:0;border-bottom:0}.avatar-wrap .c3{bottom:7px;left:7px;border-right:0;border-top:0}.avatar-wrap .c4{bottom:7px;right:7px;border-left:0;border-top:0}
.profile .meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-top:10px}
.profile .meta dt{color:var(--muted);font-weight:700;white-space:nowrap;font-family:var(--hand)}
.profile .meta dd{margin:0}
.pain{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1.5px dashed var(--ink-2);border-radius:5px;background:var(--paper-2)}
.pain .ic{width:40px;height:30px;border:2px solid var(--red);border-radius:3px;color:var(--red);font-family:var(--type);display:grid;place-items:center;flex:0 0 auto;font-size:13px;transform:rotate(-6deg)}
.pain b{display:block;color:var(--ink);margin-bottom:1px;font-family:var(--hand);font-size:15.5px}
.pain span{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.legend .it{display:flex;align-items:center;gap:8px;padding:6px 11px;border:1.5px dashed var(--line-2);border-radius:4px;background:var(--paper-2);font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .fx{padding:4px 10px;border-radius:var(--r-hand);background:var(--paper-2);border:1.5px solid var(--ink-2);font-size:13px;font-weight:700}
.flow .ar{color:var(--muted-2)}

/* 診斷結果 */
.dx-block{border:1.5px solid var(--ink-2);border-radius:6px 3px 7px 4px;padding:16px 18px;margin-bottom:16px;background:var(--paper-2)}
.dx-block h3{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dx-item{display:flex;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--line);font-size:13.5px}
.dx-item:last-child{border-bottom:0}
.dx-item .sev{flex:0 0 auto;width:11px;height:11px;border-radius:50%;margin-top:7px;border:1.5px solid var(--ink)}
.sev.h{background:var(--red)} .sev.m{background:var(--yellow)} .sev.l{background:var(--green)} .sev.i{background:var(--blue)}
.dx-item .rule{font-family:var(--type);font-size:11px;color:var(--ink-2);background:var(--paper-3);border:1px solid var(--line-2);padding:0 6px;border-radius:2px;white-space:nowrap;align-self:flex-start;margin-top:3px}
.score-ring{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;border:2px solid var(--ink)}
.ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.ring b{position:relative;z-index:1;font-family:var(--hand);font-size:30px;color:var(--ink)}
.engine-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--type);font-size:11.5px;color:var(--ink-2);background:var(--paper-2);border:1.5px dashed var(--ink-2);border-radius:3px;padding:2px 10px}
.engine-tag i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.bar-row{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.bar-row .bar{height:13px;background:var(--paper-2);border:1.5px solid var(--ink-2);border-radius:2px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--blue) 0 4px,#4a7a91 4px 8px)}
.bar-row .bar i.r{background:var(--red)} .bar-row .bar i.y{background:var(--yellow)} .bar-row .bar i.g{background:var(--green)}
.dx-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}

/* 手繪視覺化（3_rules：rough.js） */
.skbox{position:relative;padding:12px 14px}
.skbox-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.skbox-in{position:relative}
.skbars{display:grid;gap:5px}
.skbar-row{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.skbar-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skbar-row svg{width:100%;height:18px;display:block;overflow:visible}
.skbar-row b{text-align:right;font-family:var(--type);font-weight:400;font-size:12.5px}
.skbar-cap{font-size:11.5px;color:var(--red);text-align:right;margin-top:2px}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.triad-k{font-family:var(--hand);font-size:14px;color:var(--muted)}
.triad-v{font-weight:700;font-size:15px;margin-top:2px;word-break:break-word}
.triad-w{color:var(--red);font-size:12px;font-weight:700;margin-top:4px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.slot{border:1.5px solid var(--ink-2);border-radius:6px 3px 7px 4px;padding:8px 10px;background:var(--card);display:flex;flex-direction:column;gap:1px;font-size:12.5px}
.slot b{font-family:var(--type);font-weight:400;font-size:11.5px;color:var(--muted)}
.slot span{font-weight:700;line-height:1.35}
.slot em{font-style:normal;font-size:11px;color:var(--muted)}
.slot.need{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.slot.need b,.slot.need em{color:#d9cdb6}
.slot.other{border:2px solid var(--red);background:var(--red-soft)}
.slot.other em{color:var(--red);font-weight:700}
.slot.used{background:var(--green-soft);border-color:var(--green)}
.slot.unused{opacity:.5;border-style:dashed;background:transparent}
.slot.miss{opacity:1;border:2px dashed var(--red)}
.slot.miss em{color:var(--red);font-weight:700}
.acts{display:flex;gap:6px}
.act{min-width:64px}
.act .skbox{text-align:center;padding:10px 6px}
.act b{display:block;font-family:var(--hand);font-size:16px}
.act span{font-size:12px;color:var(--muted)}
.filmstrip{display:flex;gap:4px;padding:17px 6px;border-radius:3px;overflow-x:auto;background-color:var(--ink);
  background-image:linear-gradient(90deg,var(--paper-3) 0 8px,transparent 8px 16px),linear-gradient(90deg,var(--paper-3) 0 8px,transparent 8px 16px);
  background-size:16px 6px,16px 6px;background-repeat:repeat-x;background-position:4px 5px,4px calc(100% - 5px)}
.frame{min-width:46px;background:var(--paper-2);border:2px solid transparent;border-radius:2px;padding:6px;font-size:11.5px;display:flex;flex-direction:column;gap:2px}
.frame b{font-family:var(--type);font-weight:400;font-size:13px}
.frame span{font-weight:700}
.frame em{font-style:normal;color:var(--muted);word-break:break-all}
.frame i{font-style:normal;font-size:10.5px;color:var(--red);background:var(--red-soft);border-radius:2px;padding:0 3px;align-self:flex-start}
.frame.warn{border-color:var(--yellow);background:var(--yellow-soft)}
.frame.bad{border-color:var(--red)}
.checklist{display:grid;gap:6px}
.ck{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;font-size:13.5px;flex-wrap:wrap}
.ck svg{width:22px;height:22px;flex:0 0 auto;overflow:visible}
.ck span{flex:1;min-width:140px}
.ck em{font-style:normal;font-size:11.5px;color:var(--muted);text-align:right}
.ck.on{background:var(--green-soft)}
.ck.warn{background:var(--yellow-soft)}
.ck.warn em{color:#93680f;font-weight:700}
.ck.off span{color:var(--muted)}
.ck.off em{color:var(--red)}

/* 帶入、底部操作、浮層 */
.carry{border:2px dashed var(--blue);background:var(--blue-soft);border-radius:6px;padding:12px 16px;margin-bottom:18px;font-size:13.5px}
.carry h4{color:var(--blue);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.carry .chips{display:flex;flex-wrap:wrap;gap:6px}
.carry .chip{background:var(--card);border:1.5px solid var(--ink-2);border-radius:var(--r-hand);padding:3px 11px;font-size:12.5px;cursor:pointer}
.carry .chip:hover{border-color:var(--blue);color:var(--blue);box-shadow:2px 2px 0 var(--blue)}
.carry .chip.static{cursor:default;border-style:dashed}
.carry .chip.static:hover{border-color:var(--ink-2);color:inherit;box-shadow:none}
.footer-actions{position:sticky;bottom:0;background:rgba(255,252,245,.95);border-top:2px solid var(--ink);padding:12px 0;margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper-2);padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;box-shadow:3px 3px 0 var(--yellow);max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red);box-shadow:3px 3px 0 var(--ink)}
.svg-wrap{overflow:auto;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--card);padding:8px}
.svg-wrap svg{display:block;min-width:600px;width:100%;height:auto}
.modal-bg{position:fixed;inset:0;background:rgba(43,38,34,.5);display:none;align-items:center;justify-content:center;z-index:250;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-card);max-width:540px;width:100%;padding:24px;box-shadow:6px 6px 0 var(--ink)}
.lock-screen{text-align:center;padding:56px 20px}
.lock-screen .ic{font-size:46px}

/* 報告 */
.report-cover{background:var(--ink);color:var(--paper-2);border-radius:4px;padding:52px 40px 34px;margin-bottom:24px;position:relative;overflow:hidden}
.report-cover::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:repeating-linear-gradient(-55deg,var(--ink) 0 16px,var(--paper-2) 16px 32px);border-bottom:2px solid var(--paper-2)}
.report-cover h1{color:var(--paper-2);font-size:32px}
.report-cover .sub{opacity:.85}
.report-section{margin-bottom:28px}
.report-section h2{display:inline-block;font-size:22px;margin-bottom:14px;padding:0 6px;background:linear-gradient(transparent 58%,var(--yellow-soft) 58%)}
.report-section h3{font-size:16.5px;margin:14px 0 6px}
.two-col{columns:2;column-gap:28px}
#reportDoc{background:transparent}

/* 試算器 */
.sim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sim-grid3{display:grid;grid-template-columns:1fr 1.05fr 1.35fr;gap:12px}
.sim-lights{display:flex;gap:12px;flex-wrap:wrap}
.sim-light{flex:1;min-width:120px;border:1.5px dashed var(--ink-2);border-radius:5px;padding:12px;text-align:center;background:var(--paper-2)}
.sim-light .light{width:26px;height:26px;margin-bottom:6px}
.sim-light b{display:block;font-size:13px;color:var(--ink)}
.sim-light span{font-size:12px;color:var(--muted)}
.thr-tbl th,.thr-tbl td{white-space:nowrap;padding:5px 6px}
.thr-tbl input{width:66px!important;min-width:0!important}

/* 開場說明（p5.js，無音效） */
.intro{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.intro.show{display:flex}
.intro-stage{flex:1;min-height:0;position:relative;overflow:hidden}
.intro-stage canvas{display:block}
.intro.no-p5 .intro-stage{display:none}
.intro.no-p5{justify-content:center}
.intro-ui{padding:16px 24px 22px;border-top:2px solid var(--ink);background:var(--paper-2)}
.intro.no-p5 .intro-ui{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin:0 16px;border-radius:6px}
.intro-cap{max-width:860px;margin:0 auto}
.intro-no{font-family:var(--type);font-size:12.5px;letter-spacing:2px;color:var(--red)}
.intro-cap h2{font-size:28px;margin:4px 0 6px}
.intro-cap p{color:var(--ink-2);font-size:15.5px;min-height:3.2em;margin:0}
.intro-bar{max-width:860px;margin:12px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.intro-dots{display:flex;gap:6px}
.intro-dots i{width:26px;height:8px;border-radius:2px;border:1.5px solid var(--ink-2);background:transparent;cursor:pointer;overflow:hidden;position:relative}
.intro-dots i.done{background:var(--ink-2)}
.intro-dots i.on::after{content:"";position:absolute;inset:0;background:var(--red);transform-origin:left;animation:dot var(--dur,7.5s) linear forwards}
.intro-dots i.on.hold::after{animation:none}
@keyframes dot{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.credit{max-width:1180px;margin:34px auto 0;text-align:right;font-size:12px;color:var(--muted-2)}

/* PDF 擷取模式：固定寬度、隱藏互動元素 */
body.pdf-mode #reportDoc{width:960px;max-width:none;padding:8px 6px;background:#fffdf7}
body.pdf-mode .rough-annotation{display:none!important}
/* html2canvas 不支援 repeating-linear-gradient：PDF 改用一般漸層平鋪 */
body.pdf-mode .bar-row .bar i:not(.r):not(.y):not(.g){background:var(--blue)}
body.pdf-mode .report-cover::before{background:linear-gradient(90deg,var(--ink) 0 16px,var(--paper-2) 16px 32px) 0 0/32px 100% repeat-x}

@media (prefers-reduced-motion:reduce){
  .slate-clap,.intro-dots i.on::after{animation:none}
  .btn,.tile{transition:none}
}

/* ---------- RWD ---------- */
@media (max-width:1180px){.sim-grid3{grid-template-columns:1fr 1fr}}
@media (max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)} .stage-tiles{grid-template-columns:repeat(2,1fr)}
  .sim-grid{grid-template-columns:1fr 1fr}
  .slate-body{grid-template-columns:1fr}
  .slate-art{max-width:460px}
}
@media (max-width:860px){
  .topbar{padding:0 12px;gap:8px}
  .topbar .progress{display:none}
  .topbar .brand .sub{display:none}
  .topbar .menu-btn{display:inline-flex}
  .topbar .btn.top-nav{display:none}
  .topbar .brand{font-size:15.5px}
  .app{flex-direction:column}
  .sidebar{position:fixed;left:0;top:var(--topbar-h);width:min(300px,86vw);height:calc(100vh - var(--topbar-h));transform:translateX(-105%);transition:.25s;z-index:60;box-shadow:6px 0 0 var(--ink)}
  .sidebar.open{transform:none}
  .main{padding:22px 14px 40px}
  .g2,.g3,.g4,.stage-tiles,.sim-grid,.sim-grid3,.triad{grid-template-columns:1fr}
  .profile{grid-template-columns:1fr}
  .avatar-wrap{max-width:180px}
  .hero{padding:22px 18px}
  .hero h1{font-size:24px}
  .slate-body{padding:20px 16px 22px}
  .slate h1{font-size:27px}
  .slate-grid{grid-template-columns:repeat(2,1fr)}
  .slate-grid div:nth-child(2){border-right:0}
  .slate-grid div:nth-child(-n+2){border-bottom:1.5px solid rgba(251,247,238,.5)}
  .stage-hero{flex-direction:column;gap:10px;padding:20px 16px 16px}
  .stage-hero h1{font-size:23px}
  .bar-row{grid-template-columns:110px 1fr 50px}
  .skbar-row{grid-template-columns:86px 1fr 70px;gap:6px}
  .dx-head{grid-template-columns:1fr}
  .two-col{columns:1}
  .card{padding:16px 14px;box-shadow:3px 3px 0 var(--ink)}
  .report-cover{padding:40px 20px 24px}
  .footer-actions .btn{flex:1;justify-content:center}
  .intro-cap h2{font-size:22px}
  .intro-cap p{font-size:14px}
  .intro-ui{padding:12px 14px 16px}
}
.sb-overlay{position:fixed;inset:0;top:var(--topbar-h);background:rgba(43,38,34,.4);display:none;z-index:55}
.sb-overlay.show{display:block}

/* ---------- 列印（A4 報告） ---------- */
@media print{
  @page{size:A4;margin:14mm 13mm}
  html,body{background:#fff;font-size:11.5pt}
  .topbar,.sidebar,.footer-actions,.no-print,.toast,.sb-overlay,.modal-bg,.intro,.credit,.rough-annotation{display:none!important}
  .app{display:block}
  .main{padding:0}
  .container{max-width:none}
  .card,.dx-block,.form-section,.report-cover,.stage-hero{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .report-cover{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:var(--ink)!important;color:#fff!important}
  .report-section{break-inside:auto}
  .report-section h2{break-after:avoid}
  .badge,.light,.kpi,.note,.bar-row .bar i,.sev,.ring,.slot,.frame,.filmstrip,.ck,.report-section h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl{font-size:10pt}
  .tbl th,.tbl td{padding:4px 6px}
  .page-break{break-before:page;page-break-before:always}
  a{text-decoration:none;color:inherit}
  .svg-wrap{border:0;padding:0}
  .svg-wrap svg{min-width:0}
  .two-col{columns:2}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .grid.g2,.grid.g3{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:18pt}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="btn sm menu-btn" id="menuBtn" aria-label="開啟導覽">☰</button>
  <div class="brand"><div class="logo">影</div><div id="brandText">影片企劃導演工作台</div></div>
  <div class="spacer"></div>
  <div class="progress"><span id="progText">0 / 9 階段</span><div class="bar"><i id="progBar"></i></div></div>
  <button class="btn sm top-nav" onclick="go('home')">首頁</button>
  <button class="btn sm top-nav" onclick="go('report')">企劃報告</button>
  <button class="btn sm top-nav" onclick="confirmReset()">重置</button>
</header>
<div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar(false)"></div>
<div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="container" id="view"></div><footer class="credit">製作者：黃政文</footer></main></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="填寫說明">
  <div id="introStage" class="intro-stage"></div>
  <div class="intro-ui">
    <div class="intro-cap"><div class="intro-no" id="introNo"></div><h2 id="introT"></h2><p id="introS"></p></div>
    <div class="intro-bar"><div class="intro-dots" id="introDots"></div>
      <div class="btn-row"><button class="btn ghost" id="introPrev">上一段</button><button class="btn primary" id="introNext">下一段</button><button class="btn" id="introSkip">略過說明</button></div>
    </div>
  </div>
</div>
<script>

const skOpt=(o,base)=>{const opt={...base};['fill','fillStyle','hachureGap','hachureAngle'].forEach(k=>{if(o[k]!=null)opt[k]=o[k];});return opt;};

const SK_COL={r:'#c8553d',y:'#d9a23a',g:'#4f7d5c','':'#2f5d73',b:'#2f5d73'};

const skBars=(rows,o)=>{o=o||{};const max=o.max||Math.max(1,...rows.map(r=>num(r.value)));const cap=o.cap!=null?skX(o.cap,max):null;

  else H.push(R('R9-09','m','每個任務的時數估得準。','第 1 週結束時記錄實際花的時數，和計畫對照，再調整後面幾週。'));
  if(d.needHelp==='是')C.push(R('R9-10','m',`發表前需要協助（${cut(lead(d.helpNote),30)}）：Day15 前把問題和截圖整理好，帶去問老師。`));
  if(cap&&total>cap)N.push(R('R9-N1','h',`把總時數從 ${total} 降到 ${cap} 小時內（少 ${+(total-cap).toFixed(1)} 小時）：照最低可交付版本，先砍最花時間又非必要的任務。`));
  if(weakBk)N.push(R('R9-N2','h','今天寫出 3 個最可能卡住的地方與備案，貼在作品資料夾第一頁。'));
  if(!N.length)N.push(R('R9-N1','m','把每週任務排進行事曆的真實日期，設好提醒。'));
  M.push({label:'總時數',value:`${total}／${cap} 小時`,cls:cap&&total>cap?'r':'g'},{label:'超量週數',value:overW.length+' 週',cls:overW.length?'r':'g'},{label:'任務數',value:ts.length+' 個',cls:'b'},{label:'最低版本',value:hasNum(d.minVersion)?'有':'不明確',cls:hasNum(d.minVersion)?'g':'y'});
  const visual=`<h4>每週時數${wh?`（紅線＝每週可投入 ${wh} 小時）`:''}</h4>${skBars(per.map((h,i)=>({label:`第 ${i+1} 週`,value:h,cls:wh&&h>wh?'r':'g',text:h+' 小時'})),{max:Math.ceil(Math.max(wh,...per,1)*1.2),cap:wh||null,capLabel:wh?`紅線：每週 ${wh} 小時`:''})}`;
  return{score:Math.max(0,Math.min(100,score)),scoreLabel:'時程可執行度',metrics:M,assessment:A,hypotheses:H,recommendations:C,nextActions:N,visual};};

/* =====================================================================

const QUOTA_MODEL={lite:'Veo 3.1 Lite（每段 10 點）',fast:'Veo 3.1 Fast（每段 20 點）',none:'不用 Flow'};

function quotaPreset(k){const p=QUOTA_PRESETS[k];['clips','model','tries','days'].forEach(id=>document.getElementById('sim_'+id).value=p[id]);quotaRun();}
function quotaRun(){const out=document.getElementById('simOut');if(!out)return;const el=id=>document.getElementById('sim_'+id),warn=[];
  const clamp=(id,l,lo,hi)=>{const v=num(el(id).value),c=Math.min(hi,Math.max(lo,Math.round(v)));if(c!==v)warn.push(`${l}需介於 ${lo}～${hi}（目前 ${v}），已以 ${c} 計算。`);return c;};
  const clips=clamp('clips','動畫段數',0,10),tries=clamp('tries','每段試幾次',1,10),days=clamp('days','預計天數',1,14);
  const mk=QUOTA_MODEL[el('model').value]?el('model').value:'none',f=flowCalc(clips,QUOTA_MODEL[mk],tries,days),use=mk!=='none'&&clips>0;
  if(mk==='none'&&clips>0)warn.push('選了「不用 Flow」但段數大於 0：段數改成 0，或選一個模型。');
  if(use&&f.daysNeed>days){const lite=flowCalc(clips,'Lite',tries,days);warn.push(`以目前設定需要 ${f.daysNeed} 天，只排了 ${days} 天：${mk==='fast'?`改用 Lite 只要 ${lite.daysNeed} 天；`:''}或減少每段次數、把生成分散到更多天。`);}
  else if(use&&f.daysNeed===days)warn.push('天數剛好用完，沒有重試空間；任何一次生成不滿意就會延誤。');

  <div class="sim-light"><i class="light ${pl}"></i><b>共 ${f.points} 點</b><span>可用 ${50*days} 點（${days} 天 × 50）</span></div>

  ${use?`<h4 class="mt12">每天點數（紅線＝50 點；紅色＝超出排定天數）</h4>${skBars(bars,{max:60,cap:50,capLabel:'每天上限 50 點，不累積'})}${f.daysNeed>14?'<p class="tiny muted">超過 14 天的部分未列出。</p>':''}`:''}
  <p class="tiny muted mt8">計算式：生成次數 = 段數 × 每段次數；每次以 2 段 × 每段點數計；每天可生成 = 50 ÷ 每次點數（無條件捨去）；需要天數 = 生成次數 ÷ 每天可生成（無條件進位）。點數規則以 Flow 當下公告為準。</p>

/* 泳道流程圖：steps=[{step,lane,work,wait,value|ecrs}]；colorBy(s) 回傳 'r'|'y'|'g'|''（預設藍） */
function swimlaneSVG(steps,colorBy){
  steps=steps.filter(s=>s.step);if(!steps.length)return'';
  const lanes=[...new Set(steps.map(s=>s.lane||'未指定'))];
  const colW=132,laneH=78,left=150,top=30;const W=left+steps.length*colW+20,Hh=top+lanes.length*laneH+10;
  let svg=`<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" font-family="inherit" font-size="11">`;
  svg+=`<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8795a7"/></marker></defs>`;
  lanes.forEach((l,i)=>{const y=top+i*laneH;svg+=`<rect x="0" y="${y}" width="${W}" height="${laneH}" fill="${i%2?'#f8fafc':'#ffffff'}" stroke="#e3e9f2"/><text x="10" y="${y+laneH/2+4}" font-weight="700" fill="#0f2a4a">${esc(cut(l,11))}</text>`;});
  const color=s=>{const v=colorBy(s);return v==='r'?['#fde8e8','#dc2626']:v==='y'?['#fff4dd','#b7791f']:v==='g'?['#e7f7ec','#16a34a']:['#e8efff','#2563eb']};
  const pos=steps.map((s,i)=>{const li=lanes.indexOf(s.lane||'未指定');return{x:left+i*colW+8,y:top+li*laneH+12,w:colW-16,h:laneH-24}});
  pos.forEach((p,i)=>{if(i<pos.length-1){const n=pos[i+1];svg+=`<path d="M${p.x+p.w},${p.y+p.h/2} C${p.x+p.w+10},${p.y+p.h/2} ${n.x-10},${n.y+n.h/2} ${n.x},${n.y+n.h/2}" fill="none" stroke="#8795a7" stroke-width="1.5" marker-end="url(#arr)"/>`}});
  steps.forEach((s,i)=>{const p=pos[i],[bg,st]=color(s);svg+=`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${bg}" stroke="${st}" stroke-width="1.5"/><text x="${p.x+8}" y="${p.y+18}" font-weight="700" fill="#1b2a41">${i+1}. ${esc(cut(s.step,8))}</text><text x="${p.x+8}" y="${p.y+34}" fill="#5b6b7f" font-size="10">作業 ${num(s.work)}h｜等待 ${num(s.wait)}h</text><text x="${p.x+8}" y="${p.y+48}" fill="${st}" font-size="10">${esc(cut(s.value||s.ecrs||'',10))}</text>`;});
  return svg+'</svg>';
}

/* 魚骨圖：d 需含 problem 與六大類欄位；cats 可自訂 [[欄位id,標籤]]×6 */
const FISHBONE_CATS=[['fb_man','人'],['fb_machine','機／系統'],['fb_material','料／資料'],['fb_method','法／流程'],['fb_env','環'],['fb_measure','量測']];
function fishboneSVG(d,cats){
  cats=cats||FISHBONE_CATS;
  const W=900,Hh=330,spineY=165,headX=700;
  let s=`<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" font-size="10.5" font-family="inherit">`;
  s+=`<line x1="40" y1="${spineY}" x2="${headX}" y2="${spineY}" stroke="#0f2a4a" stroke-width="3"/><polygon points="${headX},${spineY-8} ${headX+12},${spineY} ${headX},${spineY+8}" fill="#0f2a4a"/>`;
  s+=`<rect x="${headX+14}" y="${spineY-48}" width="176" height="96" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>`;
  const prob=cut(d.problem||'問題',60);const lines=[];for(let i=0;i<prob.length;i+=13)lines.push(prob.slice(i,i+13));
  lines.slice(0,5).forEach((l,i)=>{s+=`<text x="${headX+22}" y="${spineY-30+i*16}" fill="#7f1d1d" font-weight="700">${esc(l)}</text>`});
  cats.forEach((c,i)=>{const top=i<3;const x=90+(i%3)*210;const yEnd=top?40:290;const txt=(d[c[0]]||'').trim();
    s+=`<line x1="${x+70}" y1="${spineY}" x2="${x}" y2="${yEnd}" stroke="#2563eb" stroke-width="2"/>`;
    s+=`<rect x="${x-34}" y="${top?yEnd-28:yEnd+4}" width="80" height="22" rx="6" fill="#0f2a4a"/><text x="${x+6}" y="${top?yEnd-13:yEnd+19}" fill="#fff" font-weight="700" text-anchor="middle">${esc(c[1])}</text>`;
    if(txt){const t=cut(txt,44);const ls=[];for(let k=0;k<t.length;k+=16)ls.push(t.slice(k,k+16));ls.slice(0,3).forEach((l,k)=>{s+=`<text x="${x+10}" y="${top?yEnd+22+k*13:yEnd-40+k*13}" fill="#1b2a41">${esc(l)}</text>`});}
    else s+=`<text x="${x+10}" y="${top?yEnd+22:yEnd-28}" fill="#a3aebb">（未填）</text>`;});
  return s+'</svg>';
}

/* ---------------- 透明規則引擎（非 LLM） ---------------- */
const Engine={
  name:'透明規則引擎 v1.0（Rule-based，非 LLM）',version:'1.0.0',adapter:null,
  registerAIAdapter(a){if(!a||typeof a.analyze!=='function')throw new Error('adapter 需提供 analyze(payload) 函式');this.adapter=a;},
  async diagnose(stageId,data,S){
    const t0=performance.now();const base=RULES[stageId](data,S);
    base.engine=this.name;base.generatedAt=new Date().toISOString();base.rulesFired=[...new Set([...base.assessment,...base.hypotheses,...base.recommendations,...base.nextActions].map(x=>x.rule))];
    base.ms=Math.round(performance.now()-t0);
    if(this.adapter){try{const extra=await this.adapter.analyze({stageId,data,context:S.all(),ruleResult:JSON.parse(JSON.stringify(base))});base.aiExtra={name:this.adapter.name||'External AI Adapter',text:String(extra&&extra.text||extra||'')};}catch(e){base.aiExtra={name:this.adapter.name||'External AI Adapter',error:String(e.message||e)};}}
    return base;
  }
};
